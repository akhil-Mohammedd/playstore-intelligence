name: quality
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
        env:
          PYTHONPATH: src
